<!doctype html>
<html lang="ko">
  <head>
    <title>INIpay Mobile WEB example</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>

  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>KG이니시스 결제샘플</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />

    <script>
      function on_pay() {
        myform = document.mobileweb;
        myform.action = 'https://mobile.inicis.com/smart/payment/';
        myform.target = '_self';

        saveLogAndSubmit(myform);
      }
      function saveLogAndSubmit(form) {
        const formData = new FormData(form);
        const jsonData = Object.fromEntries(formData.entries());
        console.log(JSON.stringify(jsonData));
        form.submit();
      }
    </script>
  </head>

  <body class="wrap">
    <!-- 본문 -->
    <main class="col-8 cont" id="bill-01">
      <!-- 페이지타이틀 -->
      <section class="mb-5">
        <div class="tit">
          <h2>일반결제</h2>
          <p>
            KG이니시스 결제창을 호출하여 다양한 지불수단으로 안전한 결제를
            제공하는 서비스
          </p>
        </div>
      </section>
      <!-- //페이지타이틀 -->

      <!-- 카드CONTENTS -->
      <section class="menu_cont mb-5">
        <div class="card">
          <form
            name="mobileweb"
            id=""
            method="post"
            class="mt-5"
            accept-charset="euc-kr"
          >
            <div
              class="row g-3 justify-content-between"
              style="--bs-gutter-x: 0rem"
            >
              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_INI_PAYMENT</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_INI_PAYMENT" value="<%= P_INI_PAYMENT %>" />
              </label>

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_MID</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_MID" value="<%= P_MID %>" />
              </label>

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_OID</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_OID" value="<%= P_OID %>" />
              </label>

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_AMT</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_AMT" value="<%= P_AMT %>" />
              </label>

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_GOODS</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_GOODS" value="<%= P_GOODS %>" />
              </label>

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_UMANE</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_UMANE" value="<%= P_UNAME %>" />
              </label>

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_MOBILE</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_MOBILE" value="<%= P_MOBILE %>" />
              </label>

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_EMAIL</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="P_EMAIL" value="<%= P_EMAIL %>" />
              </label>

              <input type="hidden" name="P_NEXT_URL" value="<%= P_NEXT_URL %>" />

              <input type="hidden" name="P_CHARSET" value="utf8" />

              <input
                type="hidden"
                name="P_TIMESTAMP"
                value="<%= P_TIMESTAMP %>"
              />
              <input type="hidden" name="P_CHKFAKE" value="<%= P_CHKFAKE %>" />

              <input type="hidden" name="P_NOTI" value="<%= P_NOTI %>" />

              <label class="col-10 col-sm-2 input param" style="border: none"
                >P_RESERVED</label
              >
              <label class="col-10 col-sm-9 input">
                <input
                  type="text"
                  name="P_RESERVED"
                  value="below1000=Y&vbank_receipt=Y&centerCd=Y&amt_hash=Y&noeasypay=Y&global_visa3d=Y"
                />
              </label>
              <label class="col-10 col-sm-2 input param" style="border: none"
                >TYPE</label
              >
              <label class="col-10 col-sm-9 input">
                <input type="text" name="type" value="PREPARE" />
              </label>
            </div>
          </form>

          <button
            onclick="on_pay()"
            class="btn_solid_pri col-6 mx-auto btn_lg"
            style="margin-top: 50px"
          >
            결제 요청
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
